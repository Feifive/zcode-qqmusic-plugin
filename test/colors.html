<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>QQ 魔法色色表回归检查</title>
<style>body{font:14px system-ui;background:#fafafa;color:#333;padding:40px;--color-foreground:#333;--color-foreground-subtle:#999;--color-interaction-ask-foreground:#658857}.dark{background:#181a18;color:#eee;--color-foreground:#eee;--color-foreground-subtle:#888}.chat-composer-region{max-width:850px;margin:50px auto}.chat-composer-input-surface{border:1px solid #8885;padding:30px;border-radius:16px}button{padding:9px;margin:4px;cursor:pointer}#result{display:block;white-space:pre-wrap;margin:24px 0}.swatches{display:flex;gap:4px;margin:18px 0}.swatches i{width:22px;height:32px;border-radius:3px}</style>
<h1>QQ 魔法色：原表色值渲染检查</h1><p>严格使用文档的亮色／暗色规则，无额外亮度修正。此页为模拟歌曲。</p>
<button id="red">红色封面</button><button id="green">绿色封面</button><button id="grey">灰度封面</button><button id="theme">切换深浅主题</button><button id="failure">封面失败</button><button id="run">运行检查</button><div class="swatches"></div><output id="result">等待运行</output>
<div id="root"><div class="chat-composer-region"><div class="chat-composer-input-surface">输入消息</div></div></div>
<script type="module">
import {colorRules,paletteForArtwork} from '../plugin/lib/colors.js';
let config={colorMode:'album'};
let artwork={magicColors:[{h:0,s:.62,b:.64}],pureColor:null},title='红色封面 · hue 0→360';
const red=()=>{artwork={magicColors:[{h:0,s:.62,b:.64}],pureColor:null};title='红色封面 · hue 0→360'};
document.querySelector('#red').onclick=red;
document.querySelector('#green').onclick=()=>{artwork={magicColors:[{h:137,s:.62,b:.64}],pureColor:null};title='绿色封面 · hue 137'};
document.querySelector('#failure').onclick=()=>{artwork=null;title='封面失败 · QQ 绿兜底'};
document.querySelector('#grey').onclick=()=>{artwork={magicColors:[],pureColor:{h:0,s:0,b:1}};title='黑白封面'};
document.querySelector('#theme').onclick=()=>document.body.classList.toggle('dark');
const swatches=document.querySelector('.swatches');for(const row of colorRules.mapping.light){const chip=document.createElement('i');chip.style.background=row.value[1];chip.title=row.value[1];swatches.append(chip)};
window.zcodeMusic={snapshot:async()=>({state:'paused',sampledAt:Date.now(),enabled:true,...config,artworkColors:artwork,track:{title,artist:'文档色表检查',playing:false,positionMs:4000,durationMs:10000},lyric:{offset:0,lines:[{start:0,duration:10000,text:'每首歌，都有自己的颜色',words:[{text:'每首歌，都有自己的颜色',start:0,duration:10000}]}]}}),configure:async c=>(config={...config,...c}),control:async()=>({ok:false})};
const script=document.createElement('script');script.src='../plugin/renderer.js';document.body.append(script);
const settle=()=>new Promise(r=>setTimeout(r,2200));const read=()=>document.querySelector('#zcode-music-plugin').style.getPropertyValue('--music-accent');
document.querySelector('#run').onclick=async()=>{
 const checks=[];const check=(name,pass)=>{checks.push({name,pass});if(!pass)throw Error(name)};
 try{
  document.body.classList.remove('dark');red();await settle();check('亮色纯红精确命中 #F3616F',read()==='#F3616F');
  document.querySelector('#green').click();await settle();check('137 度精确命中 #6ECC95',read()==='#6ECC95');
  document.body.classList.add('dark');await settle();check('暗色绿精确命中 #19A553',read()==='#19A553');
  red();await settle();check('暗色纯红精确命中 #9A232E',read()==='#9A232E');
  document.querySelector('#grey').click();await settle();check('暗色灰度精确命中 #666666',read()==='#666666');
  document.body.classList.remove('dark');await settle();check('亮色灰度精确命中 #8F8F94',read()==='#8F8F94');
  document.querySelector('#failure').click();await settle();check('亮色缺失封面回退 QQ 绿',read()==='#00F168');document.body.classList.add('dark');await settle();check('暗色缺失封面回退 QQ 绿',read()==='#00F168');document.body.classList.remove('dark');
  red();await settle();const host=document.querySelector('#zcode-music-plugin');const line=host.shadowRoot.querySelector('.lyric span');check('逐词高亮没有额外色彩混合',getComputedStyle(line).backgroundImage.includes('243, 97, 111'));
  const select=host.shadowRoot.querySelector('.color-mode');select.value='theme';select.dispatchEvent(new Event('change'));await settle();check('主题模式清除专辑色覆盖',read()===''&&!host.shadowRoot.querySelector('.dock').classList.contains('magic'));check('主题模式继承 ZCode 强调色',getComputedStyle(host).getPropertyValue('--music-accent').trim()==='#658857');document.querySelector('#failure').click();await settle();check('主题模式在封面失败时仍使用主题色',read()===''&&getComputedStyle(host).getPropertyValue('--music-accent').trim()==='#658857');red();select.value='album';select.dispatchEvent(new Event('change'));await settle();check('专辑模式恢复原表颜色',read()==='#F3616F');host.shadowRoot.querySelector('.launcher').focus();
  document.querySelector('#result').textContent='PASS '+checks.length+' checks\n'+JSON.stringify(checks,null,2);
 }catch(e){document.querySelector('#result').textContent='FAIL '+e.message+'\n'+JSON.stringify(checks,null,2)}
};
const focusReport=document.createElement('output');focusReport.id='focus-result';document.body.append(focusReport);const samples=[];document.addEventListener('focusin',()=>{const host=document.querySelector('#zcode-music-plugin');if(!host)return;const button=host.shadowRoot.activeElement;if(!button?.dataset.action)return;setTimeout(()=>{samples.push({mode:config.colorMode,action:button.dataset.action,focused:button.matches(':focus-visible'),color:getComputedStyle(button).color});focusReport.textContent=JSON.stringify(samples)},220)},true);
</script></html>
