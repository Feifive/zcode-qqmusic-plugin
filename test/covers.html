<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>专辑封面检查</title>
<style>body{font:14px system-ui;background:#fafbf8;color:#30322e;padding:40px;--color-foreground:#30322e;--color-foreground-subtle:#92968c;--color-interaction-ask-foreground:#658857;--color-surface:#fff;--color-popover:#fff;--color-border:#dfe2dc}.dark{background:#181a18;--color-foreground:#eee;--color-surface:#252823;--color-popover:#252823;--color-border:#373c33;color:#eee}.chat-composer-region{width:min(100%,900px);margin:60px auto}.chat-composer-input-surface{padding:26px;border:1px solid var(--color-border);border-radius:16px;background:var(--color-surface)}button.fixture{padding:8px 14px;margin:4px;cursor:pointer}#result{display:block;white-space:pre-wrap;margin-top:24px;max-height:150px;overflow:auto;font:12px ui-monospace,monospace}</style>
<h1>专辑封面检查</h1><p>本地模拟封面，检查切歌、失败占位和主题色模式。</p>
<button class="fixture" id="run">运行检查</button><button class="fixture" id="cover-a">封面 A</button><button class="fixture" id="cover-b">封面 B</button><button class="fixture" id="missing">无封面</button><button class="fixture" id="broken">损坏封面</button><button class="fixture" id="dark">切换深浅</button>
<output id="result">等待检查</output><div id="root"><div class="chat-composer-region"><div class="chat-composer-input-surface">输入消息</div></div></div>
<script>
function sampleCover(a,b,size=40){const c=document.createElement('canvas');c.width=c.height=size;const x=c.getContext('2d');x.scale(size/40,size/40);const g=x.createLinearGradient(0,0,40,40);g.addColorStop(0,a);g.addColorStop(1,b);x.fillStyle=g;x.fillRect(0,0,40,40);x.fillStyle='#fff8';x.beginPath();x.arc(29,12,6,0,Math.PI*2);x.fill();x.fillStyle='#112b4388';x.beginPath();x.moveTo(0,40);x.lineTo(15,18);x.lineTo(30,40);x.fill();return c.toDataURL('image/png')}
const covers={a:sampleCover('#fbcaa3','#b54575'),b:sampleCover('#b8e0c5','#257b8e')};const fullCovers={A:sampleCover('#fbcaa3','#b54575',300),B:sampleCover('#b8e0c5','#257b8e',300)};let image=covers.a,album='A',title='晚风里的唱片',config={enabled:true,colorMode:'album',showCover:true};
window.zcodeMusic={snapshot:async()=>({state:'paused',sampledAt:Date.now(),...config,artworkThumbnail:image,artworkColors:{magicColors:[{h:166,s:.62,b:.64}],pureColor:null},track:{title,albumMid:album,artist:'本地封面演示',playing:false,positionMs:24000,durationMs:180000},lyric:{offset:0,lines:[{start:0,duration:180000,text:'把此刻的旋律，留在每一行之间',words:[]}]}}),configure:async c=>c.coverPreview?{albumMid:album,image:fullCovers[album],width:300,height:300}:(config={...config,...c}),control:async()=>({ok:false})};
document.querySelector('#cover-a').onclick=()=>{image=covers.a;album='A';title='晚风里的唱片'};document.querySelector('#cover-b').onclick=()=>{image=covers.b;album='B';title='另一张唱片'};document.querySelector('#missing').onclick=()=>{image=null;title='缺少封面的唱片'};document.querySelector('#broken').onclick=()=>{image='data:image/png;base64,QUFB';title='损坏封面的唱片'};document.querySelector('#dark').onclick=()=>document.body.classList.toggle('dark');
const settle=()=>new Promise(r=>setTimeout(r,2300)),shadow=()=>document.querySelector('#zcode-music-plugin').shadowRoot,cover=()=>shadow().querySelector('.cover img');
document.querySelector('#run').onclick=async()=>{
 const checks=[],check=(name,pass)=>{checks.push({name,pass:!!pass});if(!pass)throw Error(name)};
 try{
  document.querySelector('#cover-a').click();await settle();check('封面 A 正常显示',!cover().hidden&&cover().naturalWidth===40&&cover().src===covers.a);check('显示尺寸为 20×20',cover().getBoundingClientRect().width===20&&cover().getBoundingClientRect().height===20);check('左侧音乐符号已移除',!shadow().querySelector('.note'));
  shadow().querySelector('.track').click();check('点击标题不打开设置',shadow().querySelector('.panel').hidden);shadow().querySelector('.launcher').click();check('右侧固定音符打开设置',!shadow().querySelector('.panel').hidden);
  const show=shadow().querySelector('.show-cover');show.checked=false;show.dispatchEvent(new Event('change'));await settle();check('关闭封面后左侧不显示封面或音符',shadow().querySelector('.cover').hidden&&!shadow().querySelector('.note'));check('封面关闭时仍保留右侧设置入口',getComputedStyle(shadow().querySelector('.launcher')).display!=='none');show.checked=true;show.dispatchEvent(new Event('change'));await settle();shadow().querySelector('.close').click();
  shadow().querySelector('.cover').dispatchEvent(new Event('mouseenter'));await new Promise(r=>setTimeout(r,1500));check('悬停不足两秒不显示大图',shadow().querySelector('.cover-preview').hidden);await new Promise(r=>setTimeout(r,800));check('悬停两秒后显示原尺寸大图',!shadow().querySelector('.cover-preview').hidden&&shadow().querySelector('.cover-preview img').naturalWidth===300);check('大图出现在封面上方',shadow().querySelector('.cover-preview').getBoundingClientRect().bottom<shadow().querySelector('.cover').getBoundingClientRect().top);shadow().querySelector('.cover').dispatchEvent(new Event('mouseleave'));check('移出封面后大图关闭',shadow().querySelector('.cover-preview').hidden);
  document.querySelector('#cover-b').click();await settle();check('切歌替换旧封面',!cover().hidden&&cover().src===covers.b);
  document.querySelector('#missing').click();await settle();check('缺图清除旧封面并显示占位',cover().hidden&&!cover().hasAttribute('src'));
  document.querySelector('#broken').click();await settle();check('损坏图片显示占位',cover().hidden);
  document.querySelector('#cover-a').click();await settle();check('后续有效图片可恢复',!cover().hidden&&cover().src===covers.a);
  const select=shadow().querySelector('.color-mode');select.value='theme';select.dispatchEvent(new Event('change'));await settle();check('主题色模式仍显示封面',!cover().hidden&&cover().src===covers.a);check('主题色模式保持原强调色',getComputedStyle(document.querySelector('#zcode-music-plugin')).getPropertyValue('--music-accent').trim()==='#658857');
  check('未播放进度保持灰色',getComputedStyle(shadow().querySelector('.progress')).backgroundColor==='rgba(136, 136, 136, 0.267)');
  document.querySelector('#result').textContent='PASS '+checks.length+' checks\n'+JSON.stringify(checks,null,2);
 }catch(e){document.querySelector('#result').textContent='FAIL '+e.message+'\n'+JSON.stringify(checks,null,2)}
};
</script><script src="../plugin/renderer.js"></script></html>
