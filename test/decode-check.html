<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>封面缩略对照检查</title>
<style>body{font:15px system-ui;background:#fafafa;color:#333;margin:40px;max-width:1200px}button,select{padding:8px 12px}.samples{display:flex;gap:28px;flex-wrap:wrap;margin:24px 0}.sample{width:250px}.sample canvas{width:100px;height:100px;image-rendering:pixelated;border-radius:6px}.sample img{width:150px;height:150px;border-radius:8px}.swatch{height:12px;border-radius:6px;margin:14px 0}output{display:block;font:12px ui-monospace,monospace;white-space:pre-wrap;line-height:1.6}h2{font-size:16px}</style>
<h1>封面缩略对照检查</h1><p>系统参考像素来自已验证的 ImageIO 助手。浏览器与盒式平均仅为诊断对照，不用于生产取色。</p>
<select id="album" aria-label="回归专辑"><option value="qingtian">晴天／叶惠美</option><option value="tree">一棵会开花的树／谢春花作品选集 (2015)，2:56 原版</option></select><button id="run">比较缩略方式</button><p id="result">等待检查</p>
<div class="samples"><section class="sample"><h2>源封面</h2><img id="source" alt="回归专辑封面"><output id="identity"></output></section><section class="sample"><h2>ImageIO 系统参考</h2><canvas id="native" width="10" height="10"></canvas><div class="swatch" id="native-swatch"></div><output id="native-result"></output></section><section class="sample"><h2>浏览器单步缩略</h2><canvas id="single" width="10" height="10"></canvas><div class="swatch" id="single-swatch"></div><output id="single-result"></output></section><section class="sample"><h2>盒式平均（实验对照）</h2><canvas id="box" width="10" height="10"></canvas><div class="swatch" id="box-swatch"></div><output id="box-result"></output></section></div>
<script type="module">
import {boxAverage} from '../plugin/lib/resampling.js'
import {extractMagicColors,paletteForArtwork,rgbToHSB,hueBucket} from '../plugin/lib/colors.js'
const fixtures=await(await fetch('./fixtures/artwork.json')).json(),$=selector=>document.querySelector(selector)
const describe=pixels=>{
 const colors=extractMagicColors(pixels,{order:'rgba'}),buckets=Array(8).fill(0)
 for(let i=0;i<pixels.length;i+=4){const c=rgbToHSB(...pixels.slice(i,i+3));if(c.b*100>=12&&c.s*100>11)buckets[hueBucket(c.h)]++}
 return{accent:paletteForArtwork(colors).accent,primaryHue:colors.magicColors[0]?.h,buckets}
}
let ticket=0
async function compare(){
 const current=++ticket
 try{
  const entry=fixtures[$('#album').value],image=$('#source');image.src='./fixtures/'+entry.file;await image.decode();if(current!==ticket)return
  $('#identity').textContent=entry.albumMid+'\n'+(entry.album||'叶惠美')
  const full=document.createElement('canvas');full.width=image.naturalWidth;full.height=image.naturalHeight
  const context=full.getContext('2d',{willReadFrequently:true});context.drawImage(image,0,0)
  const box=boxAverage(context.getImageData(0,0,full.width,full.height).data,full.width,full.height)
  const native=Uint8ClampedArray.from(atob(entry.imageIO.pixels),char=>char.charCodeAt(0))
  const single=$('#single').getContext('2d',{willReadFrequently:true});single.imageSmoothingQuality='high';single.drawImage(image,0,0,10,10)
  for(const [name,pixels]of [['native',native],['single',single.getImageData(0,0,10,10).data],['box',box]]){
   $('#'+name).getContext('2d').putImageData(new ImageData(new Uint8ClampedArray(pixels),10,10),0,0)
   const result=describe(pixels);$('#'+name+'-swatch').style.background=result.accent;$('#'+name+'-result').textContent=JSON.stringify(result,null,2)
  }
  if(describe(native).accent!==entry.expectedAccent)throw Error('系统参考样本映射不匹配')
  $('#result').textContent='系统参考验证通过；生产管线的实时像素一致性由 test/native-artwork.test.mjs 校验。'
 }catch(error){if(current===ticket)$('#result').textContent='检查失败：'+error.message}
}
$('#run').onclick=compare;$('#album').onchange=compare;compare()
</script></html>
