<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>进度拖动检查</title>
<style>body{font:14px system-ui;background:#fafafa;color:#333;padding:40px;--color-interaction-ask-foreground:#658857;--color-surface:#fff;--color-popover:#fff;--color-border:#ddd}.chat-composer-region{max-width:900px;margin:60px auto}.chat-composer-input-surface{padding:30px;border:1px solid #ddd;border-radius:16px;background:white}button.fixture{padding:9px;margin:4px;cursor:pointer}output{display:block;white-space:pre-wrap;font:12px ui-monospace,monospace;max-height:160px;overflow:auto;margin:20px 0}</style>
<h1>进度拖动检查</h1><p>本地模拟播放：拖动时预览、松手提交、键盘定位及失败恢复。不会操作真实播放器。</p>
<button class="fixture" id="run">运行检查</button><output id="result">等待检查</output><output id="calls">定位命令：0</output>
<div id="root"><div class="chat-composer-region"><div class="chat-composer-input-surface">输入消息</div></div></div>
<script>
let config={enabled:true,colorMode:'theme',showCover:false},title='进度拖动演示',position=20000,duration=100000,playing=false,fail=false;const commands=[]
window.zcodeMusic={snapshot:async()=>({state:playing?'playing':'paused',...config,sampledAt:Date.now(),track:{app:'com.tencent.QQMusicMac',title,artist:'本地模拟',positionMs:position,durationMs:duration,playing,seekable:false},lyric:{offset:0,lines:[{start:0,duration:100000,text:'拖动预览，松手后定位',words:[]}]}}),configure:async c=>(config={...config,...c}),control:async(action,target)=>{
 commands.push({action,target});document.querySelector('#calls').textContent='定位命令：'+commands.length+' · '+JSON.stringify(commands.at(-1))
 await new Promise(r=>setTimeout(r,300));if(fail==='throw')throw Error('模拟失败');if(fail)return{ok:false,error:'seek-not-applied'};position=target;playing=true;return{ok:true,verified:true}
}}
const wait=ms=>new Promise(r=>setTimeout(r,ms)),shadow=()=>document.querySelector('#zcode-music-plugin').shadowRoot,slider=()=>shadow().querySelector('.progress')
function pointer(type,ratio){const rect=slider().getBoundingClientRect();slider().dispatchEvent(new PointerEvent(type,{bubbles:true,composed:true,pointerId:7,isPrimary:true,button:0,clientX:rect.left+ratio*rect.width,clientY:rect.top}))}
const value=()=>Number(slider().getAttribute('aria-valuenow'))
document.querySelector('#run').onclick=async()=>{
 const checks=[],check=(name,pass)=>{checks.push({name,pass:!!pass});if(!pass)throw Error(name)}
 try{
  await wait(2200);check('已知时长时启用定位，不依赖能力标记',slider().getAttribute('aria-disabled')==='false')
  pointer('pointerdown',.2);pointer('pointermove',.8);await wait(80);check('拖动中显示预览且未发命令',value()===80000&&commands.length===0&&shadow().querySelector('.time').textContent==='1:20 / 1:40')
  position=30000;await wait(2200);check('实时快照不覆盖拖动预览',value()===80000)
  pointer('pointerup',.75);await wait(50);check('松手只提交一次并保持等待预览',commands.length===1&&commands[0].target===75000&&value()===75000);pointer('pointerup',.9);await wait(400);check('确认后采用真实位置',commands.length===1&&Math.abs(value()-75000)<1000);check('暂停定位成功后自动播放',shadow().querySelector('.dock').classList.contains('playing'))
  pointer('pointerdown',.9);pointer('pointercancel',.9);await wait(80);check('取消拖动不提交',commands.length===1&&Math.abs(value()-75000)<1000)
  pointer('pointerdown',.2);title='另一首歌';position=20000;playing=false;await wait(2200);pointer('pointerup',.9);await wait(80);check('切歌取消未完成拖动',commands.length===1&&value()===20000)
  for(const mode of [true,'throw']){fail=mode;pointer('pointerdown',.5);pointer('pointerup',.5);await wait(450);check(mode===true?'定位失败提示并恢复真实进度':'IPC 异常也能恢复',!shadow().querySelector('.panel').hidden&&shadow().querySelector('.status').textContent==='定位失败，请在 QQ 音乐中操作'&&value()===20000);shadow().querySelector('.close').click()}
  fail=false;slider().dispatchEvent(new KeyboardEvent('keydown',{key:'ArrowRight',bubbles:true,cancelable:true}));await wait(450);check('右方向键定位前进五秒',commands.at(-1).target===25000&&Math.abs(value()-25000)<1000)
  pointer('pointerdown',-.5);pointer('pointerup',-.5);await wait(450);check('左侧越界钳制到零',commands.at(-1).target===0&&value()<1000)
  pointer('pointerdown',1.5);pointer('pointerup',1.5);await wait(450);check('右侧越界钳制到终点',commands.at(-1).target===100000&&value()===100000)
  duration=0;await wait(2200);const before=commands.length;pointer('pointerdown',.5);pointer('pointerup',.5);await wait(80);check('未知时长不提交',slider().getAttribute('aria-disabled')==='true'&&commands.length===before)
  duration=100000;position=40000;playing=false;await wait(2200);shadow().querySelector('.demo').click();pointer('pointerdown',.5);pointer('pointerup',.5);await wait(80);check('演示模式不操作播放器',slider().getAttribute('aria-disabled')==='true'&&commands.length===before);shadow().querySelector('.demo').click()
  check('未播放进度保持灰色',getComputedStyle(slider()).backgroundColor==='rgba(136, 136, 136, 0.267)')
  document.querySelector('#result').textContent='PASS '+checks.length+' checks\n'+JSON.stringify(checks,null,2)
 }catch(error){document.querySelector('#result').textContent='FAIL '+error.message+'\n'+JSON.stringify(checks,null,2)}
}
</script><script src="../plugin/renderer.js"></script></html>
