<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZCode 音乐歌词插件预览</title>
<style>
:root{--color-accent:#658857;--color-interaction-ask-foreground:#658857;--color-foreground:#30322e;--color-foreground-subtle:#898c85;--color-surface:#fff;--color-border:#dfe2dc;--color-hover:#f0f2ed}*{box-sizing:border-box}body{margin:0;background:#fafbf8;color:var(--color-foreground);font:14px -apple-system,BlinkMacSystemFont,sans-serif}aside{width:240px;position:fixed;inset:0 auto 0 0;background:#f0f1ed;padding:28px 20px;border-right:1px solid var(--color-border)}aside b{font-size:20px;color:#222}aside p{color:#8c8f85;font-size:12px;margin-top:32px}aside div{padding:10px 12px;background:#e4e7df;border-radius:8px;margin-top:12px}main{margin-left:240px;min-height:100vh;display:flex;flex-direction:column;padding:50px 32px 26px}article{margin:auto;width:100%;max-width:850px}h1{font-weight:500;font-size:28px;letter-spacing:-.6px}article p{color:#92968c;line-height:1.8}.chat-composer-region{width:100%;max-width:900px;margin:60px auto 0}.chat-composer-input-surface{border:1px solid var(--color-border);padding:20px;border-radius:18px;background:#fff;min-height:130px;box-shadow:0 4px 18px #40502005}textarea{font:14px inherit;width:100%;height:46px;resize:none;border:0;outline:0;background:transparent;color:inherit}.actions{display:flex;justify-content:space-between;font-size:12px;color:#92968c}.send{background:#dfe5d9;padding:4px 9px;border-radius:7px}.caption{font-size:11px;color:#a2a69c;text-align:center;margin-top:14px}.theme{position:fixed;top:20px;right:26px;border:1px solid var(--color-border);background:var(--color-surface);color:inherit;border-radius:8px;padding:6px 12px;cursor:pointer}
body.dark{background:#181a18;color:#e2e5df;--color-accent:#a9c391;--color-interaction-ask-foreground:#a9c391;--color-popover:#252823;--color-foreground:#e2e5df;--color-foreground-subtle:#888f83;--color-surface:#252823;--color-border:#373c33;--color-hover:#34392f}body.dark aside{background:#20231e}body.dark aside b{color:#ddd}body.dark aside div{background:#30362a}body.dark .chat-composer-input-surface{background:#22261f}
@media(max-width:800px){aside{display:none}main{margin-left:0;padding:24px 14px}h1{font-size:23px}.chat-composer-region{margin-top:250px}}
</style>
<aside><b>ZCode</b><p>工作空间</p><div>♫ 音乐插件预览</div><p>界面验证 · 本地演示</p></aside>
<main id="root"><article><h1>让音乐，陪你写下一行灵感。</h1><p>同步歌词就在输入框上方。悬停切换播放控制，点击最右侧 ♪ 打开设置。<br>设置中可切换专辑封面显示，悬停封面约 2 秒查看大图。</p></article><div class="chat-composer-region"><div class="chat-composer-input-surface"><textarea placeholder="描述你想构建的内容…"></textarea><div class="actions"><span>＋　项目上下文　·　默认模型</span><span class="send">↑</span></div></div></div><div class="caption">QQ 音乐歌词插件 · 演示界面</div></main><button class="theme" onclick="document.body.classList.toggle('dark')">切换主题</button>
<script>let config={enabled:true,anyApp:false};window.zcodeMusic={snapshot:async()=>({state:config.enabled?'idle':'disabled',...config,track:null,lyric:null}),configure:async c=>(config={...config,...c}),control:async()=>({ok:false})}</script><script src="plugin/renderer.js"></script>
</html>
